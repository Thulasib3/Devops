name: Delete .circleci from specific repos

on:
  workflow_dispatch:
    inputs:
      repos:
        description: "Comma-separated list of repository names"
        required: true
        default: ""

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq python3-pip
          pip3 install openai

      - name: Remove .circleci from selected repos
        id: cleanup_step
        env:
          GH_USER: Thulasib3
          GH_EMAIL: kamasanithulasireddy@gmail.com
          GH_PAT: ${{ secrets.GH_PAT }}
          REPOS_INPUT: ${{ github.event.inputs.repos }}
        run: |
          set -o pipefail
          exec > >(tee cleanup.log) 2>&1

          git config --global user.email "$GH_EMAIL"
          git config --global user.name "$GH_USER"

          IFS=',' read -ra repos <<< "$REPOS_INPUT"

          for repo in "${repos[@]}"; do
            repo=$(echo "$repo" | xargs)
            echo "Processing repository: $repo"

            branches=$(curl -s -H "Authorization: token $GH_PAT" \
              "https://api.github.com/repos/$GH_USER/$repo/branches?per_page=100" \
              | jq -r '.[].name')

            for branch in $branches; do
              echo "  Processing branch: $branch"

              git clone -b "$branch" \
                "https://$GH_PAT@github.com/$GH_USER/$repo.git" tmp_repo
              cd tmp_repo || exit 1

              if [ -d ".circleci" ]; then
                rm -rf .circleci
                git rm -r --cached .circleci || true
                git commit -m "Remove .circleci folder" || true
                git push origin "$branch"
                echo "    ✅ Deleted .circleci from $branch"
              else
                echo "    ℹ No .circleci folder found in $branch"
              fi

              cd ..
              rm -rf tmp_repo
            done
          done

      # ✅ SUCCESS CASE
      - name: 🤖 ChatGPT Success Summary
        if: success()
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python3 << 'EOF'
          from openai import OpenAI
          import os

          client = OpenAI(api_key=os.getenv("OPENAI_API_KEY"))

          prompt = """
          You are a DevOps assistant.
          The GitHub Actions pipeline completed SUCCESSFULLY.
          Respond with a short confirmation message suitable for logs.
          """

          response = client.chat.completions.create(
              model="gpt-4o-mini",
              messages=[{"role": "user", "content": prompt}],
              temperature=0.1
          )

          print("\n✅ PIPELINE STATUS\n")
          print(response.choices[0].message.content)
          EOF

      # ❌ FAILURE CASE
      - name: 🤖 ChatGPT Failure Analysis
        if: failure()
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python3 << 'EOF'
          from openai import OpenAI
          import os

          client = OpenAI(api_key=os.getenv("OPENAI_API_KEY"))

          with open("cleanup.log", "r", errors="ignore") as f:
              logs = f.read()[-12000:]

          prompt = f"""
          You are a Senior DevOps SME.

          The GitHub Actions pipeline FAILED.
          Analyze the logs and provide:
          1. Root cause
          2. Exact fix steps
          3. Whether retry will help (YES/NO)

          Logs:
          {logs}
          """

          response = client.chat.completions.create(
              model="gpt-4o-mini",
              messages=[{"role": "user", "content": prompt}],
              temperature=0.2
          )

          print("\n❌ PIPELINE FAILURE ANALYSIS\n")
          print(response.choices[0].message.content)
          EOF
